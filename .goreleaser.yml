# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: sweet

before:
  hooks:
    - go test ./pkg/cli/... ./pkg/core/...
    - go vet ./pkg/cli/... ./pkg/core/...

builds:
  - id: sweet
    dir: pkg/cli
    main: ./cmd/sweet
    binary: sweet
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md

checksum:
  name_template: checksums.txt

release:
  prerelease: auto
  use_existing_draft: true
  replace_existing_artifacts: true
  mode: replace
  # Let GitHub choose latest by release chronology/SemVer, including on retries.
  make_latest: legacy

changelog:
  sort: asc
