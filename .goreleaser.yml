# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: sweet

before:
  hooks:
    - bash {{ if index .Env "SWEET_GO_CHECK" }}{{ .Env.SWEET_GO_CHECK }}{{ else }}.github/scripts/check-go.sh{{ end }}

builds:
  - id: sweet
    dir: pkg/sweet
    main: ./cmd/sweet
    binary: sweet
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: '{{ if index .Env "SWEET_RELEASE_VERSION" }}{{ .Env.SWEET_RELEASE_VERSION }}{{ else }}0.0.0-SNAPSHOT-{{ .ShortCommit }}{{ end }}'

changelog:
  disable: true
