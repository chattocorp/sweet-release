name: Manage a GitHub Release
description: Prepare a draft from Sweet metadata or publish it after asset uploads succeed.
inputs:
  phase:
    description: status, draft, or publish. Publish requires an existing release.
    required: true
  package:
    description: Package directory relative to the repository root (draft phase only).
  version:
    description: Package version at the release commit (draft phase only).
  tag:
    description: Existing release tag.
    required: true
  commit:
    description: Exact expected commit SHA. Checkout and tag must match it.
    required: true
  sweet-version:
    description: Sweet binary release tag, latest, or source for development.
    default: latest
  latest:
    description: Explicitly mark a stable release as Latest when publishing.
    default: 'false'
  token:
    description: Token with contents write permission.
    default: ${{ github.token }}
outputs:
  state:
    description: missing, draft, or published.
    value: ${{ steps.release.outputs.state }}
  published:
    description: true if the release is already published (skip builds and uploads).
    value: ${{ steps.release.outputs.published }}
runs:
  using: composite
  steps:
    - if: inputs.phase == 'draft'
      uses: $/actions/tooling
      with:
        sweet-version: ${{ inputs.sweet-version }}
    - id: release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_PHASE: ${{ inputs.phase }}
        RELEASE_PACKAGE: ${{ inputs.package }}
        RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_TAG: ${{ inputs.tag }}
        RELEASE_COMMIT: ${{ inputs.commit }}
        RELEASE_LATEST: ${{ inputs.latest }}
        ACTION_PATH: ${{ github.action_path }}
      run: python3 "$ACTION_PATH/release.py"
