name: Set up Sweet
description: Download a Sweet release and verify its checksum.
inputs:
  version:
    description: Release tag (for example sweet@0.3.0 or apps/sweet/v0.2.0), or latest.
    default: latest
  token:
    description: GitHub token for release downloads.
    default: ${{ github.token }}
outputs:
  version:
    description: Installed CLI version.
    value: ${{ steps.install.outputs.version }}
  tag:
    description: Resolved release tag.
    value: ${{ steps.install.outputs.tag }}
runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        SWEET_VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: python3 "$ACTION_PATH/install.py"
