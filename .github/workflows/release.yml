name: Release

on:
  workflow_call:
    inputs:
      base:
        description: Commit before the push (all-zero SHA for a new branch).
        required: true
        type: string
      head:
        description: Exact commit to release after caller checks pass.
        required: true
        type: string
      sweet-version:
        description: Sweet release tag, latest, or source for development.
        type: string
        default: latest
      push-tags:
        description: Create and push package tags before running release commands.
        type: boolean
        default: true
      release-command:
        description: Optional build or verification command at each release commit, before upload/publication.
        type: string
        default: ''
      github-release:
        description: Prepare release notes and a draft, then publish after the build and uploads succeed.
        type: boolean
        default: false
      github-latest:
        description: GitHub Latest policy (auto, true, or false). Use false for monorepos with their own promotion policy.
        type: string
        default: auto
      goreleaser:
        description: Optional pinned GoReleaser version (for example v2.18.2). Builds snapshot archives for the release version.
        type: string
        default: ''
      go-version-file:
        description: Go version file for the optional GoReleaser build.
        type: string
        default: go.mod
      goreleaser-package:
        description: Optional package path to build with GoReleaser; other packages publish notes only.
        type: string
        default: ''
      release-assets:
        description: Optional newline-separated file globs to upload. GoReleaser archives and checksums are included automatically.
        type: string
        default: ''
    secrets:
      release-token:
        description: Optional token for tag pushes and release commands; defaults to GITHUB_TOKEN.
        required: false
    outputs:
      releases:
        description: JSON array of package, version, tag, and commit, including matching existing tags on retries.
        value: ${{ jobs.plan.outputs.releases }}

# Inherit caller permissions: plan-only runs can use contents: read.
# Tag pushes and publication commands require the caller to grant write access.

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      releases: ${{ steps.tags.outputs.releases }}
      sweet-tag: ${{ steps.tooling.outputs.tag }}
    steps:
      - name: Validate release options
        env:
          GITHUB_RELEASE: ${{ inputs.github-release }}
          GORELEASER: ${{ inputs.goreleaser }}
          ASSETS: ${{ inputs.release-assets }}
          LATEST: ${{ inputs.github-latest }}
        run: |
          case "$LATEST" in auto|true|false) ;; *) echo 'Invalid github-latest'; exit 1 ;; esac
          if [[ "$GITHUB_RELEASE" != true && ( -n "$GORELEASER" || -n "$ASSETS" ) ]]; then
            echo 'goreleaser and release-assets require github-release'; exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head }}
          fetch-depth: 0
          token: ${{ secrets.release-token || github.token }}
      - id: tooling
        uses: $/.github/actions/bootstrap
        with:
          sweet-version: ${{ inputs.sweet-version }}
      - name: Plan releases and optionally push tags
        id: tags
        env:
          BASE: ${{ inputs.base }}
          HEAD: ${{ inputs.head }}
          SCRIPTS: ${{ steps.tooling.outputs.scripts }}
          PUSH_TAGS: ${{ inputs.push-tags }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash "$SCRIPTS/tag-releases.sh" "$(command -v sweet)" "$BASE" "$HEAD"

  release:
    needs: plan
    if: (inputs.github-release || inputs.release-command != '') && needs.plan.outputs.releases != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.releases) }}
    concurrency:
      group: sweet-github-release-${{ matrix.tag }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.release-token || github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_PACKAGE: ${{ matrix.package }}
      RELEASE_VERSION: ${{ matrix.version }}
      RELEASE_TAG: ${{ matrix.tag }}
      RELEASE_COMMIT: ${{ matrix.commit }}
      RELEASE_LATEST: ${{ inputs.github-latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.commit }}
          fetch-depth: 0
          token: ${{ secrets.release-token || github.token }}
      - id: tooling
        uses: $/.github/actions/bootstrap
        with:
          sweet-version: ${{ needs.plan.outputs.sweet-tag }}
      - name: Prepare GitHub Release
        id: draft
        if: inputs.github-release
        env:
          SCRIPTS: ${{ steps.tooling.outputs.scripts }}
          RELEASE_PHASE: draft
        run: |
          python3 "$SCRIPTS/github-release.py"
          echo "state=$(python3 "$SCRIPTS/github-release.py" status "$RELEASE_TAG" "$RELEASE_COMMIT")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        if: inputs.goreleaser != '' && (inputs.goreleaser-package == '' || inputs.goreleaser-package == matrix.package) && steps.draft.outputs.state != 'published'
        with:
          go-version-file: ${{ inputs.go-version-file }}
      - uses: goreleaser/goreleaser-action@v7
        if: inputs.goreleaser != '' && (inputs.goreleaser-package == '' || inputs.goreleaser-package == matrix.package) && steps.draft.outputs.state != 'published'
        with:
          version: ${{ inputs.goreleaser }}
          args: release --snapshot --clean
        env:
          GORELEASER_CURRENT_TAG: v${{ matrix.version }}
      - name: Run package release command
        if: inputs.release-command != '' && steps.draft.outputs.state != 'published'
        env:
          RELEASE_COMMAND: ${{ inputs.release-command }}
          SCRIPTS: ${{ steps.tooling.outputs.scripts }}
        run: bash "$SCRIPTS/release-command.sh"
      - name: Upload release assets
        if: inputs.github-release && steps.draft.outputs.state != 'published'
        env:
          SCRIPTS: ${{ steps.tooling.outputs.scripts }}
          RELEASE_ASSETS: ${{ inputs.release-assets }}
          GORELEASER: ${{ (inputs.goreleaser-package == '' || inputs.goreleaser-package == matrix.package) && inputs.goreleaser || '' }}
        run: python3 "$SCRIPTS/upload-assets.py"
      - name: Publish GitHub Release
        if: inputs.github-release && steps.draft.outputs.state != 'published'
        env:
          SCRIPTS: ${{ steps.tooling.outputs.scripts }}
          RELEASE_PHASE: publish
        run: python3 "$SCRIPTS/github-release.py"
