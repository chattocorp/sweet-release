name: Release

on:
  workflow_call:
    inputs:
      mode:
        description: auto previews PRs and releases main pushes; plan/release override this for explicit callers.
        type: string
        default: auto
      base:
        description: Optional full base SHA; defaults to the push or PR base. Override together with head.
        type: string
      head:
        description: Optional full head SHA; defaults to the pushed commit or PR test merge.
        type: string
      sweet-version:
        description: Sweet release tag, latest, or source for development.
        type: string
        default: sweet@0.3.0
      push-tags:
        description: Create and push package tags before running release commands.
        type: boolean
        default: true
      release-command:
        description: Optional build or verification command at each release commit, before upload/publication.
        type: string
        default: ''
      github-release:
        description: Prepare release notes and a draft, then publish after the build and uploads succeed.
        type: boolean
        default: false
      github-latest:
        description: GitHub Latest policy (auto, true, or false). Use false for monorepos with their own promotion policy.
        type: string
        default: auto
      goreleaser:
        description: Optional pinned GoReleaser version (for example v2.18.2). Builds snapshot archives for the release version.
        type: string
        default: ''
      go-version-file:
        description: Go version file for the optional GoReleaser build.
        type: string
        default: go.mod
      goreleaser-package:
        description: Optional package path to build with GoReleaser; other packages publish notes only.
        type: string
        default: ''
      release-assets:
        description: Optional newline-separated file globs to upload. GoReleaser archives and checksums are included automatically.
        type: string
        default: ''
    secrets:
      release-token:
        description: Optional token for tag pushes and release commands; defaults to GITHUB_TOKEN.
        required: false
    outputs:
      releases:
        description: JSON array of package, version, tag, and commit, including matching existing tags on retries.
        value: ${{ jobs.plan.outputs.releases }}

# Inherit caller permissions: plan-only runs can use contents: read.
# Tag pushes and publication commands require the caller to grant write access.

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      releases: ${{ steps.tags.outputs.releases }}
      sweet-tag: ${{ steps.tooling.outputs.tag }}
      mode: ${{ steps.context.outputs.mode }}
      head: ${{ steps.context.outputs.head }}
    steps:
      - name: Validate release options
        env:
          GITHUB_RELEASE: ${{ inputs.github-release }}
          GORELEASER: ${{ inputs.goreleaser }}
          ASSETS: ${{ inputs.release-assets }}
          LATEST: ${{ inputs.github-latest }}
        run: |
          case "$LATEST" in auto|true|false) ;; *) echo 'Invalid github-latest'; exit 1 ;; esac
          if [[ "$GITHUB_RELEASE" != true && ( -n "$GORELEASER" || -n "$ASSETS" ) ]]; then
            echo 'goreleaser and release-assets require github-release'; exit 1
          fi
      - id: tooling
        uses: $/.github/actions/bootstrap
        with:
          sweet-version: ${{ inputs.sweet-version }}
      - name: Resolve event and commit range
        id: context
        env:
          MODE: ${{ inputs.mode }}
          BASE: ${{ inputs.base }}
          HEAD: ${{ inputs.head }}
          SCRIPTS: ${{ steps.tooling.outputs.scripts }}
        run: python3 "$SCRIPTS/release-plan.py" context
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.context.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Plan releases (read-only)
        id: tags
        env:
          BASE: ${{ steps.context.outputs.base }}
          HEAD: ${{ steps.context.outputs.head }}
          MODE: ${{ steps.context.outputs.mode }}
          SCRIPTS: ${{ steps.tooling.outputs.scripts }}
        run: python3 "$SCRIPTS/release-plan.py" plan "$(command -v sweet)"

  tag:
    needs: plan
    if: needs.plan.outputs.mode == 'release' && inputs.push-tags && needs.plan.outputs.releases != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.head }}
          fetch-depth: 0
          token: ${{ secrets.release-token || github.token }}
      - id: tooling
        uses: $/.github/actions/bootstrap
        with:
          install: 'false'
      - name: Push planned tags atomically
        env:
          RELEASES: ${{ needs.plan.outputs.releases }}
          SCRIPTS: ${{ steps.tooling.outputs.scripts }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 "$SCRIPTS/release-plan.py" tag

  release:
    needs: [plan, tag]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (needs.tag.result == 'success' || needs.tag.result == 'skipped') &&
      needs.plan.outputs.mode == 'release' && needs.plan.outputs.releases != '[]' &&
      (inputs.github-release || inputs.release-command != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.releases) }}
    concurrency:
      group: sweet-github-release-${{ matrix.tag }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.release-token || github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_PACKAGE: ${{ matrix.package }}
      RELEASE_VERSION: ${{ matrix.version }}
      RELEASE_TAG: ${{ matrix.tag }}
      RELEASE_COMMIT: ${{ matrix.commit }}
      RELEASE_LATEST: ${{ inputs.github-latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.commit }}
          fetch-depth: 0
          token: ${{ secrets.release-token || github.token }}
      - id: tooling
        uses: $/.github/actions/bootstrap
        with:
          sweet-version: ${{ needs.plan.outputs.sweet-tag }}
      - name: Prepare GitHub Release
        id: draft
        if: inputs.github-release
        env:
          SCRIPTS: ${{ steps.tooling.outputs.scripts }}
          RELEASE_PHASE: draft
        run: |
          python3 "$SCRIPTS/github-release.py"
          echo "state=$(python3 "$SCRIPTS/github-release.py" status "$RELEASE_TAG" "$RELEASE_COMMIT")" >> "$GITHUB_OUTPUT"
      - name: Build release assets
        id: build
        uses: $/.github/actions/build
        if: steps.draft.outputs.state != 'published'
        with:
          goreleaser: ${{ (inputs.goreleaser-package == '' || inputs.goreleaser-package == matrix.package) && inputs.goreleaser || '' }}
          go-version-file: ${{ inputs.go-version-file }}
          command: ${{ inputs.release-command }}
          assets: ${{ inputs.release-assets }}
      - name: Upload release assets
        id: upload
        if: inputs.github-release && steps.draft.outputs.state != 'published'
        env:
          SCRIPTS: ${{ steps.tooling.outputs.scripts }}
          BUILT_ASSETS: ${{ steps.build.outputs.assets }}
        run: python3 "$SCRIPTS/upload-assets.py"
      - name: Publish GitHub Release
        id: publish
        if: inputs.github-release && steps.draft.outputs.state != 'published'
        env:
          SCRIPTS: ${{ steps.tooling.outputs.scripts }}
          RELEASE_PHASE: publish
        run: python3 "$SCRIPTS/github-release.py"
      - name: Summarize release outcome
        if: always() && steps.tooling.outcome == 'success'
        env:
          SCRIPTS: ${{ steps.tooling.outputs.scripts }}
          DRAFT_STATE: ${{ steps.draft.outputs.state }}
          PREPARE_OUTCOME: ${{ steps.draft.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: python3 "$SCRIPTS/release-summary.py"
