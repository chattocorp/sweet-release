name: Tag releases

on:
  workflow_call:
    inputs:
      base:
        required: true
        type: string
      head:
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cli-releases: ${{ steps.tags.outputs.cli-releases }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: pkg/cli/go.mod
          cache-dependency-path: |
            pkg/cli/go.sum
            pkg/core/go.sum
      - name: Create release tags
        id: tags
        env:
          BASE: ${{ inputs.base }}
          HEAD: ${{ inputs.head }}
        run: |
          go build -o "$RUNNER_TEMP/sweet" ./pkg/cli/cmd/sweet
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash .github/scripts/tag-releases.sh "$RUNNER_TEMP/sweet" "$BASE" "$HEAD"

  publish:
    needs: tag
    if: needs.tag.outputs.cli-releases != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.tag.outputs.cli-releases) }}
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ matrix.tag }}
      commit: ${{ matrix.commit }}
