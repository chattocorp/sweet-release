name: Tag releases

on:
  workflow_call:
    inputs:
      base:
        required: true
        type: string
      head:
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-release.yml
    with:
      base: ${{ inputs.base }}
      head: ${{ inputs.head }}
      sweet-version: source
      draft: true

  select-cli:
    needs: tag
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.select.outputs.releases }}
      other-releases: ${{ steps.select.outputs.other-releases }}
    steps:
      - id: select
        env:
          RELEASES: ${{ needs.tag.outputs.releases }}
        run: |
          releases=$(jq -c '[.[] | select(.package == "apps/sweet" or .package == "pkg/sweet" or .package == "pkg/cli")]' <<< "$RELEASES")
          echo "releases=$releases" >> "$GITHUB_OUTPUT"
          others=$(jq -c '[.[] | select(.package != "apps/sweet" and .package != "pkg/sweet" and .package != "pkg/cli")]' <<< "$RELEASES")
          echo "other-releases=$others" >> "$GITHUB_OUTPUT"

  publish-notes:
    needs: select-cli
    if: needs.select-cli.outputs.other-releases != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select-cli.outputs.other-releases) }}
    concurrency:
      group: sweet-github-release-${{ matrix.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.commit }}
          fetch-depth: 0
      - uses: $/actions/github-release
        with:
          phase: publish
          package: ${{ matrix.package }}
          version: ${{ matrix.version }}
          tag: ${{ matrix.tag }}
          commit: ${{ matrix.commit }}

  publish:
    needs: select-cli
    if: needs.select-cli.outputs.releases != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select-cli.outputs.releases) }}
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ matrix.tag }}
      commit: ${{ matrix.commit }}
