name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# PR policy belongs to this integration, not .sweet.config.yml.
env:
  RELEASE_PR_STRATEGY: per-package # or combined

# Serialize whole runs, including cleanup. A queued run starts from current main.
concurrency:
  group: release-pr-main
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prs: ${{ steps.plan.outputs.prs }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/sweet/go.mod
          cache-dependency-path: apps/sweet/go.sum
      - name: Plan release PRs
        id: plan
        run: |
          go run ./apps/sweet/cmd/sweet status --json > "$RUNNER_TEMP/packages.json"
          prs=$(python3 .github/scripts/release-pr.py matrix "$RELEASE_PR_STRATEGY" < "$RUNNER_TEMP/packages.json")
          printf 'prs=%s\n' "$prs" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  prepare:
    needs: plan
    if: needs.plan.outputs.prs != '[]'
    name: ${{ matrix.title }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.prs) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check release PR token
        env:
          RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          if [[ -z "$RELEASE_PR_TOKEN" ]]; then
            echo '::error::Set the RELEASE_PR_TOKEN repository secret. See docs/development.md.'
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/sweet/go.mod
          cache-dependency-path: apps/sweet/go.sum
      - name: Prepare pending releases
        id: prepare
        env:
          RELEASE_JOB: ${{ toJSON(matrix) }}
        run: |
          go build -o "$RUNNER_TEMP/sweet" ./apps/sweet/cmd/sweet
          changed=$(python3 .github/scripts/release-pr.py prepare "$RUNNER_TEMP/sweet" "$RELEASE_JOB" "$RUNNER_TEMP/release")
          printf 'changed=%s\n' "$changed" >> "$GITHUB_OUTPUT"
          printf 'title=%s\n' "$(cat "$RUNNER_TEMP/release/title.txt")" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
        if: steps.prepare.outputs.changed == 'true' && contains(matrix.packages, 'apps/docs')
        with:
          package_json_file: apps/docs/package.json
      - uses: actions/setup-node@v6
        if: steps.prepare.outputs.changed == 'true' && contains(matrix.packages, 'apps/docs')
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/docs/pnpm-lock.yaml
      - name: Update and verify documentation release
        if: steps.prepare.outputs.changed == 'true' && contains(matrix.packages, 'apps/docs')
        run: |
          pnpm --dir apps/docs install --lockfile-only --no-frozen-lockfile --ignore-scripts
          pnpm --dir apps/docs install --frozen-lockfile
          pnpm --dir apps/docs run check
          pnpm --dir apps/docs run build
      - name: Verify prepared changes
        if: steps.prepare.outputs.changed == 'true'
        run: |
          git diff --check
          test -z "$(gofmt -l apps/sweet)"
          go test -race ./apps/sweet/...
          go vet ./apps/sweet/...
          go build -o "$RUNNER_TEMP/sweet" ./apps/sweet/cmd/sweet
      - name: Create or update release PR
        if: steps.prepare.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          # Use a PAT so PR checks run without manual workflow approval.
          token: ${{ secrets.RELEASE_PR_TOKEN }}
          base: main
          # The workflow assigns stable branches so each open PR is reused.
          branch: ${{ matrix.branch }}
          delete-branch: true
          commit-message: 'chore: prepare releases'
          title: ${{ steps.prepare.outputs.title }}
          body-path: ${{ runner.temp }}/release/body.md
      - name: Record desired release PR
        uses: actions/upload-artifact@v4
        with:
          name: release-result-${{ strategy.job-index }}
          path: ${{ runner.temp }}/release/desired.json
          if-no-files-found: error
          overwrite: true

  cleanup:
    needs: [plan, prepare]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      (needs.prepare.result == 'success' ||
       (needs.prepare.result == 'skipped' && needs.plan.outputs.prs == '[]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.prs != '[]'
        with:
          pattern: release-result-*
          path: ${{ runner.temp }}/release-results
      - name: Remove obsolete release PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_JOBS: ${{ needs.plan.outputs.prs }}
          PLANNED_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          export RELEASE_PRS='[]'
          if [[ "$RELEASE_JOBS" != '[]' ]]; then
            # Missing results must stop cleanup, not be treated as no releases.
            expected=$(jq 'length' <<< "$RELEASE_JOBS")
            files=("$RUNNER_TEMP"/release-results/*/desired.json)
            [[ ${#files[@]} -eq "$expected" ]]
            RELEASE_PRS=$(jq -sc 'add' "${files[@]}")
          fi
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$current" != "$PLANNED_SHA" ]]; then
            echo 'Main changed during this run; leave cleanup to the next run.'
            exit 0
          fi
          bash .github/scripts/cleanup-release-prs.sh
