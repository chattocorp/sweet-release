name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One writer owns the release branch. A queued run starts from current main.
concurrency:
  group: release-pr-main
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-go@v7
        with:
          go-version-file: pkg/cli/go.mod
          cache-dependency-path: |
            pkg/cli/go.sum
            pkg/core/go.sum
      - name: Prepare pending releases
        run: go run ./pkg/cli/cmd/sweet bump --all
      # Project-specific steps, such as regenerating lockfiles, belong here.
      - name: Verify prepared changes
        run: |
          git diff --check
          test -z "$(gofmt -l pkg)"
          go test -race ./pkg/cli/... ./pkg/core/...
          go vet ./pkg/cli/... ./pkg/core/...
          go build -o "$RUNNER_TEMP/sweet" ./pkg/cli/cmd/sweet
      - name: Describe pending releases
        run: |
          # Include first-release changelogs in the diff without staging their contents.
          while IFS= read -r -d '' path; do
            git add --intent-to-add -- "$path"
          done < <(git ls-files --others --exclude-standard -z -- CHANGELOG.md '**/CHANGELOG.md')

          {
            printf 'This PR prepares the following releases:\n'

            git -c core.quotePath=false diff --no-ext-diff --no-color --unified=0 -- CHANGELOG.md '**/CHANGELOG.md' |
              awk '
                /^\+\+\+ b\// {
                  package = substr($0, 7)
                  sub(/\/?CHANGELOG\.md$/, "", package)
                  if (package == "") package = "."
                  printf "\n## `%s`\n", package
                  version = 0
                  next
                }
                /^\+/ {
                  line = substr($0, 2)
                  if (!version && line == "# Changelog") next
                  if (!version && line ~ /^## /) {
                    printf "\nTarget version: **%s**\n", substr(line, 4)
                    version = 1
                    next
                  }
                  print line
                }
              '
          } > "$RUNNER_TEMP/release-pr-body.md"
      - name: Create or update release PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          # Keep this branch fixed, without branch-suffix, to reuse the open PR.
          branch: sweet/release
          delete-branch: true
          commit-message: 'chore: prepare releases'
          title: 'chore: prepare releases'
          body-path: ${{ runner.temp }}/release-pr-body.md
