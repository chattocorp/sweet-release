name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Serialize whole runs, including cleanup. A queued run starts from current main.
concurrency:
  group: release-pr-main
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prs: ${{ steps.plan.outputs.prs }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/sweet/go.mod
          cache-dependency-path: apps/sweet/go.sum
      - name: Plan release PRs
        id: plan
        run: |
          prs=$(go run ./apps/sweet/cmd/sweet release-pr plan)
          # GitHub limits a job matrix to 256 entries.
          jq -e 'length <= 256' <<< "$prs" > /dev/null
          printf 'prs=%s\n' "$prs" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  prepare:
    needs: plan
    if: needs.plan.outputs.prs != '[]'
    name: ${{ matrix.title }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.prs) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/sweet/go.mod
          cache-dependency-path: apps/sweet/go.sum
      - name: Prepare pending releases
        env:
          PACKAGES: ${{ toJSON(matrix.packages) }}
          RELEASE_BRANCH: ${{ matrix.branch }}
        run: |
          go run ./apps/sweet/cmd/sweet release-pr plan --details > "$RUNNER_TEMP/release-plan.json"
          jq -er --arg branch "$RELEASE_BRANCH" '.[] | select(.branch == $branch) | .body' \
            "$RUNNER_TEMP/release-plan.json" > "$RUNNER_TEMP/release-pr-body.md"
          mapfile -d '' -t packages < <(jq -j '.[] | ., "\u0000"' <<< "$PACKAGES")
          go run ./apps/sweet/cmd/sweet bump -- "${packages[@]}"
      - uses: pnpm/action-setup@v6
        if: contains(matrix.packages, 'apps/docs')
        with:
          package_json_file: apps/docs/package.json
      - uses: actions/setup-node@v6
        if: contains(matrix.packages, 'apps/docs')
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/docs/pnpm-lock.yaml
      - name: Update and verify documentation release
        if: contains(matrix.packages, 'apps/docs')
        run: |
          pnpm --dir apps/docs install --lockfile-only --no-frozen-lockfile --ignore-scripts
          pnpm --dir apps/docs install --frozen-lockfile
          pnpm --dir apps/docs run check
          pnpm --dir apps/docs run build
      - name: Verify prepared changes
        run: |
          git diff --check
          test -z "$(gofmt -l apps/sweet)"
          go test -race ./apps/sweet/...
          go vet ./apps/sweet/...
          go build -o "$RUNNER_TEMP/sweet" ./apps/sweet/cmd/sweet
      - name: Create or update release PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          # The planner assigns stable branches so each open PR is reused.
          branch: ${{ matrix.branch }}
          delete-branch: true
          commit-message: 'chore: prepare releases'
          title: ${{ matrix.title }}
          body-path: ${{ runner.temp }}/release-pr-body.md

  cleanup:
    needs: [plan, prepare]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      (needs.prepare.result == 'success' ||
       (needs.prepare.result == 'skipped' && needs.plan.outputs.prs == '[]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Remove obsolete release PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PRS: ${{ needs.plan.outputs.prs }}
          PLANNED_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$current" != "$PLANNED_SHA" ]]; then
            echo 'Main changed during this run; leave cleanup to the next run.'
            exit 0
          fi
          bash .github/scripts/cleanup-release-prs.sh
