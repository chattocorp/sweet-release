name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Every main push owns a commit range that must reach tagging. Do not coalesce
  # those runs; branch and PR checks can still replace obsolete runs.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  setup-action:
    name: Install released CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bootstrap
        with:
          sweet-version: apps/sweet/v0.2.0
      - shell: bash
        run: sweet --version

  check:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/sweet/go.mod
          cache-dependency-path: apps/sweet/go.sum
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l apps/sweet)
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on these files:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Test with race detection
        run: go test -race ./apps/sweet/...
      - name: Run static checks
        run: go vet ./apps/sweet/...
      - name: Test workflow scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Build CLI
        run: go build -o bin/sweet ./apps/sweet/cmd/sweet

  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/docs/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/docs/pnpm-lock.yaml
      - run: pnpm --dir apps/docs install --frozen-lockfile
      - run: pnpm --dir apps/docs run check
      - run: pnpm --dir apps/docs run build

  tag:
    needs: [check, docs, setup-action]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/tag.yml
    secrets:
      # A personal or App token, so the pushed tags trigger release-cli.yml.
      release-token: ${{ secrets.RELEASE_PR_TOKEN }}
