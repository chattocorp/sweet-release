name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Every main push owns a commit range that must reach tagging. Do not coalesce
  # those runs; branch and PR checks can still replace obsolete runs.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-contract:
    name: Builder asset contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RELEASE_VERSION: 0.3.0
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Build GoReleaser assets without publication
        id: go-build
        uses: $/.github/actions/build
        with:
          goreleaser: v2.18.2
          go-version-file: apps/sweet/go.mod
          command: test "$(dist/sweet_linux_amd64_v1/sweet --version)" = "sweet $RELEASE_VERSION"
      - name: Verify GoReleaser asset contract
        env:
          ASSETS: ${{ steps.go-build.outputs.assets }}
        run: python3 -c 'import json, os; from pathlib import Path; a=json.loads(os.environ["ASSETS"]); assert len(a)==7; assert all(Path(p).is_file() for p in a)'
      - name: Build custom assets without publication
        id: custom-build
        uses: $/.github/actions/build
        with:
          command: |
            mkdir -p "$RUNNER_TEMP/custom-build"
            printf 'custom artifact\n' > "$RUNNER_TEMP/custom-build/artifact.txt"
          assets: ${{ runner.temp }}/custom-build/*.txt
      - name: Verify custom asset contract
        env:
          ASSETS: ${{ steps.custom-build.outputs.assets }}
        run: python3 -c 'import json, os; from pathlib import Path; a=json.loads(os.environ["ASSETS"]); assert len(a)==1; assert Path(a[0]).read_text()=="custom artifact\n"'

  release-contract:
    name: Release contract (${{ matrix.mode }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: plan-only
            command: exit 99
          - mode: command
            command: |
              test "$RELEASE_PACKAGE" = apps/sweet
              test "$RELEASE_VERSION" = 0.2.0
              test -n "$RELEASE_TAG"
              test "$RELEASE_COMMIT" = 0c591e471bac87293929f0e9a1edcfc3f8a8b918
              test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
              sweet status --json
    uses: ./.github/workflows/release.yml
    with:
      # Historical version bump: exercise real planning and exact-commit commands
      # without permission to push tags or publish anything.
      mode: ${{ matrix.mode == 'plan-only' && 'plan' || 'release' }}
      github-release: ${{ matrix.mode == 'plan-only' }}
      goreleaser: ${{ matrix.mode == 'plan-only' && 'v2.18.2' || '' }}
      base: 9316cc87dfcac8b7cbeb2e407caee4279731e405
      head: 0c591e471bac87293929f0e9a1edcfc3f8a8b918
      sweet-version: source
      push-tags: ${{ matrix.mode == 'plan-only' }}
      release-command: ${{ matrix.command }}

  release-policy:
    name: Published release retry
    # This exercises published-release retries without permission to mutate releases.
    permissions:
      contents: read
    uses: ./.github/workflows/release.yml
    with:
      mode: release
      base: 6e0540d1d474fd83577c85f3f896f43dae275b88
      head: fc9e0dea13c61edf7bdd0a04a21eca0f68a72e35
      sweet-version: source
      github-release: true
      push-tags: false
      # The matching tag exists: planning must not push; publication must skip.
      release-command: exit 99

  setup-action:
    name: Install released CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bootstrap
        with:
          sweet-version: apps/sweet/v0.2.0
      - shell: bash
        run: sweet --version

  check:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/sweet/go.mod
          cache-dependency-path: apps/sweet/go.sum
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l apps/sweet)
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on these files:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Test with race detection
        run: go test -race ./apps/sweet/...
      - name: Run static checks
        run: go vet ./apps/sweet/...
      - name: Test workflow scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Build CLI
        run: go build -o bin/sweet ./apps/sweet/cmd/sweet

  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/docs/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/docs/pnpm-lock.yaml
      - run: pnpm --dir apps/docs install --frozen-lockfile
      - run: pnpm --dir apps/docs run check
      - run: pnpm --dir apps/docs run build

  release:
    needs: [check, docs, setup-action, release-policy, release-contract, build-contract]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      sweet-version: source
      github-release: true
      github-latest: ${{ 'false' }}
      goreleaser: v2.18.2
      goreleaser-package: apps/sweet
      go-version-file: apps/sweet/go.mod
      release-command: |
        if [[ "$RELEASE_PACKAGE" == apps/sweet ]]; then
          test "$(dist/sweet_linux_amd64_v1/sweet --version)" = "sweet $RELEASE_VERSION"
          (cd dist && sha256sum --check checksums.txt)
        fi

  promote-latest:
    needs: release
    if: needs.release.outputs.releases != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: promote-latest-cli
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Promote highest stable CLI release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/promote-latest.py
