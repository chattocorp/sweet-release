name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Every main push owns a commit range that must reach tagging. Do not coalesce
  # those runs; branch and PR checks can still replace obsolete runs.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  release-actions:
    name: Shared release actions (${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        version: [source, apps/sweet/v0.2.0]
    # This exercises published-release retries without permission to mutate releases.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: apps/sweet/v0.2.0
          fetch-depth: 0
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: $/actions/github-release
        id: status
        with:
          phase: status
          tag: apps/sweet/v0.2.0
          commit: ${{ steps.source.outputs.commit }}
      - uses: $/actions/github-release
        id: draft
        with:
          phase: draft
          package: apps/sweet
          version: 0.2.0
          tag: apps/sweet/v0.2.0
          commit: ${{ steps.source.outputs.commit }}
          sweet-version: ${{ matrix.version }}
      - uses: $/actions/github-release
        id: publish
        with:
          phase: publish
          tag: apps/sweet/v0.2.0
          commit: ${{ steps.source.outputs.commit }}
      - name: Verify published release was preserved
        env:
          DRAFT_PUBLISHED: ${{ steps.draft.outputs.published }}
          STATE: ${{ steps.status.outputs.state }}
          PUBLISHED: ${{ steps.publish.outputs.published }}
        run: |
          [[ "$STATE" == published && "$DRAFT_PUBLISHED" == true && "$PUBLISHED" == true ]]
          sweet --version

  setup-action:
    name: Install released CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/setup
        with:
          version: apps/sweet/v0.2.0
      - shell: bash
        run: sweet --version

  check:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/sweet/go.mod
          cache-dependency-path: apps/sweet/go.sum
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l apps/sweet)
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on these files:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Test with race detection
        run: go test -race ./apps/sweet/...
      - name: Run static checks
        run: go vet ./apps/sweet/...
      - name: Test release promotion
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Test binary installer
        run: python3 -m unittest discover -s actions/setup -p 'test_*.py'
      - name: Test GitHub Release lifecycle
        run: python3 -m unittest discover -s actions/github-release -p 'test_*.py'
      - name: Build CLI
        run: go build -o bin/sweet ./apps/sweet/cmd/sweet

  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/docs/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/docs/pnpm-lock.yaml
      - run: pnpm --dir apps/docs install --frozen-lockfile
      - run: pnpm --dir apps/docs run check
      - run: pnpm --dir apps/docs run build

  release:
    needs: [check, docs, setup-action, release-actions]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      base: ${{ github.event.before }}
      head: ${{ github.sha }}
      sweet-version: source
      draft: true

  select-releases:
    needs: release
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.select.outputs.cli }}
      notes: ${{ steps.select.outputs.notes }}
    steps:
      - id: select
        env:
          RELEASES: ${{ needs.release.outputs.releases }}
        run: |
          cli=$(jq -c '[.[] | select(.package == "apps/sweet" or .package == "pkg/sweet" or .package == "pkg/cli")]' <<< "$RELEASES")
          notes=$(jq -c '[.[] | select(.package != "apps/sweet" and .package != "pkg/sweet" and .package != "pkg/cli")]' <<< "$RELEASES")
          echo "cli=$cli" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

  publish-notes:
    needs: select-releases
    if: needs.select-releases.outputs.notes != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select-releases.outputs.notes) }}
    concurrency:
      group: sweet-github-release-${{ matrix.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.commit }}
          fetch-depth: 0
      - uses: $/actions/github-release
        with:
          phase: publish
          tag: ${{ matrix.tag }}
          commit: ${{ matrix.commit }}

  publish-cli:
    needs: select-releases
    if: needs.select-releases.outputs.cli != '[]'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select-releases.outputs.cli) }}
    uses: ./.github/workflows/publish-cli.yml
    with:
      tag: ${{ matrix.tag }}
      commit: ${{ matrix.commit }}
