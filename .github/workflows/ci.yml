name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Every main push owns a commit range that must reach tagging. Do not coalesce
  # those runs; branch and PR checks can still replace obsolete runs.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  release-contract:
    name: Release contract (${{ matrix.mode }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: plan-only
            command: ''
          - mode: command
            command: |
              test "$RELEASE_PACKAGE" = apps/sweet
              test "$RELEASE_VERSION" = 0.2.0
              test -n "$RELEASE_TAG"
              test "$RELEASE_COMMIT" = 0c591e471bac87293929f0e9a1edcfc3f8a8b918
              test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
              sweet status --json
    uses: ./.github/workflows/release.yml
    with:
      # Historical version bump: exercise real planning and exact-commit commands
      # without permission to push tags or publish anything.
      base: 9316cc87dfcac8b7cbeb2e407caee4279731e405
      head: 0c591e471bac87293929f0e9a1edcfc3f8a8b918
      sweet-version: source
      push-tags: false
      release-command: ${{ matrix.command }}

  release-policy:
    name: Published release retry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This exercises published-release retries without permission to mutate releases.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: apps/sweet/v0.2.0
          fetch-depth: 0
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: bootstrap
        uses: $/.github/actions/bootstrap
        with:
          install: 'false'
      - name: Verify published release was preserved
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SCRIPTS: ${{ steps.bootstrap.outputs.scripts }}
          RELEASE_PACKAGE: apps/sweet
          RELEASE_VERSION: 0.2.0
          RELEASE_TAG: apps/sweet/v0.2.0
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          state=$(python3 "$SCRIPTS/github-release.py" status "$RELEASE_TAG" "$RELEASE_COMMIT")
          [[ "$state" == published ]]
          bash "$SCRIPTS/release-package.sh"

  setup-action:
    name: Install released CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bootstrap
        with:
          sweet-version: apps/sweet/v0.2.0
      - shell: bash
        run: sweet --version

  check:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/sweet/go.mod
          cache-dependency-path: apps/sweet/go.sum
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l apps/sweet)
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on these files:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Test with race detection
        run: go test -race ./apps/sweet/...
      - name: Run static checks
        run: go vet ./apps/sweet/...
      - name: Test workflow scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Build CLI
        run: go build -o bin/sweet ./apps/sweet/cmd/sweet

  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/docs/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/docs/pnpm-lock.yaml
      - run: pnpm --dir apps/docs install --frozen-lockfile
      - run: pnpm --dir apps/docs run check
      - run: pnpm --dir apps/docs run build

  release:
    needs: [check, docs, setup-action, release-policy, release-contract]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      # One-off recovery: retain the original release range and tagged source.
      base: ${{ github.event_name == 'workflow_dispatch' && '6e0540d1d474fd83577c85f3f896f43dae275b88' || github.event.before }}
      head: ${{ github.event_name == 'workflow_dispatch' && 'fc9e0dea13c61edf7bdd0a04a21eca0f68a72e35' || github.sha }}
      sweet-version: source
      release-command: bash "$SCRIPTS/release-package.sh"

  promote-latest:
    needs: release
    if: needs.release.outputs.releases != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: promote-latest-cli
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Promote highest stable CLI release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/promote-latest.py
