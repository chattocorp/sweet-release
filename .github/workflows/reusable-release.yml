name: Reusable releases

on:
  workflow_call:
    inputs:
      base:
        description: Commit before the push (all-zero SHA for a new branch).
        required: true
        type: string
      head:
        description: Exact commit to release after caller checks pass.
        required: true
        type: string
      sweet-version:
        description: Sweet release tag, latest, or source for development.
        type: string
        default: latest
      draft:
        description: Leave releases as drafts for downstream asset uploads.
        type: boolean
        default: false
    outputs:
      releases:
        description: JSON array of package, version, tag, and commit, including matching existing tags on retries.
        value: ${{ jobs.tag.outputs.releases }}

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      releases: ${{ steps.tags.outputs.releases }}
      sweet-tag: ${{ steps.tooling.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head }}
          fetch-depth: 0
      - id: tooling
        uses: $/actions/tooling
        with:
          sweet-version: ${{ inputs.sweet-version }}
      - name: Create and push release tags
        id: tags
        env:
          BASE: ${{ inputs.base }}
          HEAD: ${{ inputs.head }}
          SCRIPTS: ${{ steps.tooling.outputs.scripts }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash "$SCRIPTS/tag-releases.sh" "$(command -v sweet)" "$BASE" "$HEAD"

  github-releases:
    needs: tag
    if: needs.tag.outputs.releases != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.tag.outputs.releases) }}
    concurrency:
      group: sweet-github-release-${{ matrix.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.commit }}
          fetch-depth: 0
      - uses: $/actions/github-release
        with:
          phase: draft
          package: ${{ matrix.package }}
          version: ${{ matrix.version }}
          tag: ${{ matrix.tag }}
          commit: ${{ matrix.commit }}
          sweet-version: ${{ needs.tag.outputs.sweet-tag }}
      - if: ${{ !inputs.draft }}
        uses: $/actions/github-release
        with:
          phase: publish
          package: ${{ matrix.package }}
          version: ${{ matrix.version }}
          tag: ${{ matrix.tag }}
          commit: ${{ matrix.commit }}
