name: Prepare releases

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/bump.yml
    with:
      strategy: per-package
      prepare-command: bash .github/scripts/prepare-release.sh
    secrets:
      release-token: ${{ secrets.RELEASE_PR_TOKEN }}
