name: Publish CLI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing CLI tag to publish (sweet@... or a historical path/v... tag)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sweet-github-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Use this workflow's tooling even when publishing an older source tag.
      - name: Preserve release tooling
        run: |
          mkdir -p "$RUNNER_TEMP/release-tooling/.github" "$RUNNER_TEMP/release-tooling/actions"
          cp .goreleaser.yml "$RUNNER_TEMP/release-tooling/"
          cp -R .github/scripts "$RUNNER_TEMP/release-tooling/.github/"
          cp -R actions/github-release "$RUNNER_TEMP/release-tooling/actions/"
      - name: Check out release source
        id: source
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" == sweet@* || "$TAG" == apps/sweet/v* || "$TAG" == pkg/sweet/v* || "$TAG" == pkg/cli/v* ]]
          commit=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          git checkout --detach "$commit"
          case "$TAG" in
            sweet@*) package=apps/sweet; version=${TAG#sweet@} ;;
            apps/sweet/v*) package=apps/sweet; version=${TAG#apps/sweet/v} ;;
            pkg/sweet/v*) package=pkg/sweet; version=${TAG#pkg/sweet/v} ;;
            pkg/cli/v*) package=pkg/cli; version=${TAG#pkg/cli/v} ;;
          esac
          printf 'package=%s\nversion=%s\ncommit=%s\n' "$package" "$version" "$commit" >> "$GITHUB_OUTPUT"
      - name: Check GitHub Release
        id: status
        uses: $/actions/github-release
        with:
          phase: status
          tag: ${{ inputs.tag }}
          commit: ${{ steps.source.outputs.commit }}
      - name: Install release metadata tooling
        if: steps.status.outputs.published != 'true'
        uses: $/actions/tooling
        with:
          sweet-version: source
      - name: Select release Go module
        if: steps.status.outputs.published != 'true'
        id: release-go
        run: |
          echo "version-file=$(bash "$RUNNER_TEMP/release-tooling/.github/scripts/check-go.sh" version-file)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        if: steps.status.outputs.published != 'true'
        with:
          go-version-file: ${{ steps.release-go.outputs.version-file }}
          cache-dependency-path: |
            apps/sweet/go.sum
            pkg/sweet/go.sum
            go.sum
            pkg/cli/go.sum
            pkg/core/go.sum
      - uses: goreleaser/goreleaser-action@v7
        if: steps.status.outputs.published != 'true'
        with:
          version: v2.18.2
          install-only: true
      - name: Release package
        if: steps.status.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PACKAGE: ${{ steps.source.outputs.package }}
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        run: bash "$RUNNER_TEMP/release-tooling/.github/scripts/release-package.sh"

  promote-latest:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Different tags can build concurrently, but Latest is repository-wide.
    # A replacement queued job reconciles all releases, not only its own tag.
    concurrency:
      group: promote-latest-cli
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Promote highest stable CLI release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/promote-latest.py
