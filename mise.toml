[tools]
go = "1.27.3"
goreleaser = "2.18.2"

[tasks.sweet]
description = "Run sweet from source (forwards CLI arguments)"
dir = "{{config_root}}/pkg/cli/cmd/sweet"
run = "go run ."

[tasks.deploy]
description = "Install sweet into ~/.local/bin"
env.GOBIN = "{{env.HOME}}/.local/bin"
run = "go install ./pkg/cli/cmd/sweet"

[tasks.build]
description = "Build the sweet CLI"
run = "go build -o bin/sweet ./pkg/cli/cmd/sweet"

[tasks.test]
description = "Run Go tests"
run = "go test ./pkg/cli/... ./pkg/core/..."

[tasks."release:check"]
description = "Validate the GoReleaser configuration"
run = "goreleaser check"

[tasks."release:snapshot"]
description = "Build release archives locally without publishing"
run = "goreleaser release --snapshot --clean"

[tasks.check]
description = "Run Go tests and static checks"
run = ["go test ./pkg/cli/... ./pkg/core/...", "go vet ./pkg/cli/... ./pkg/core/..."]
