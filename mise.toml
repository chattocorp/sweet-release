[tools]
go = "1.27.3"

[tasks.sweet]
description = "Run sweet from source (forwards CLI arguments)"
dir = "{{config_root}}/packages/cli/cmd/sweet"
run = "go run ."

[tasks.deploy]
description = "Install sweet into ~/.local/bin"
env.GOBIN = "{{env.HOME}}/.local/bin"
run = "go install ./packages/cli/cmd/sweet"

[tasks.build]
description = "Build the sweet CLI"
run = "go build -o bin/sweet ./packages/cli/cmd/sweet"

[tasks.test]
description = "Run Go tests"
run = "go test ./packages/cli/... ./packages/core/..."

[tasks.check]
description = "Run Go tests and static checks"
run = ["go test ./packages/cli/... ./packages/core/...", "go vet ./packages/cli/... ./packages/core/..."]
